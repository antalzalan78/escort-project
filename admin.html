<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<title>Booking administration | Meet Milan</title>
<style>
  :root{--bg:#09090a;--card:#151518;--line:#313137;--gold:#c9a04e;--soft:#ead29c;--text:#f2eee7;--muted:#aaa6a0;--red:#d47c7c;--green:#76bd89}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}
  main{width:min(1080px,92vw);margin:0 auto;padding:54px 0 90px}h1,h2{font-family:Georgia,serif;font-weight:500}h1{color:var(--soft);font-size:2.3rem;margin:0}
  .top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:34px}.eyebrow{color:var(--gold);letter-spacing:3px;text-transform:uppercase;font-size:.68rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:22px}.login{max-width:460px;margin:80px auto}
  label{display:block;color:var(--soft);font-size:.7rem;letter-spacing:1.4px;text-transform:uppercase;margin:13px 0 6px}
  input,select{width:100%;border:1px solid var(--line);border-radius:9px;background:#0e0e11;color:var(--text);padding:13px;font:inherit}
  button{border:1px solid var(--gold);border-radius:30px;background:var(--gold);color:#09090a;padding:11px 18px;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;color:var(--soft)}button.danger{border-color:#744;background:transparent;color:var(--red)}button:disabled{opacity:.45;cursor:wait}
  .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.status{min-height:24px;color:var(--muted);margin-top:12px}.error{color:var(--red)}
  .slot{border-top:1px solid var(--line);padding:19px 0}.slot:first-child{border-top:0}.slot-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
  .slot-time{font-family:Georgia,serif;font-size:1.22rem}.pill{font-size:.64rem;letter-spacing:1.2px;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:5px 10px;color:var(--muted)}
  .pill.available{color:var(--green);border-color:#315b3b}.pill.request_pending{color:var(--soft);border-color:#725d30}.pill.booked{color:#92aee0;border-color:#354b70}.pill.blocked{color:var(--red);border-color:#704040}
  .request{margin-top:14px;padding:16px;border-radius:11px;background:#0e0e11;border:1px solid var(--line)}.request p{margin:4px 0;color:var(--muted)}.request strong{color:var(--text)}
  .actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.empty{color:var(--muted);text-align:center;padding:30px}.hidden{display:none!important}
  @media(max-width:620px){main{padding-top:30px}.top,.slot-head{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr}.row button{width:100%}.card{padding:19px}}
</style>
</head>
<body>
<main>
  <section class="card login" id="loginPanel">
    <div class="eyebrow">Private access</div><h1>Booking administration</h1>
    <form id="loginForm">
      <label for="email">Email</label><input id="email" type="email" autocomplete="username" required />
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required />
      <button type="submit" style="width:100%;margin-top:20px">Sign in</button>
      <p class="status" id="loginStatus" aria-live="polite"></p>
    </form>
  </section>

  <section class="card login hidden" id="passwordPanel">
    <div class="eyebrow">Secure setup</div><h1>Choose your admin password</h1>
    <form id="passwordForm">
      <label for="newPassword">New password</label><input id="newPassword" type="password" minlength="10" autocomplete="new-password" required />
      <label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required />
      <button type="submit" style="width:100%;margin-top:20px">Save password</button>
      <p class="status" id="passwordStatus" aria-live="polite"></p>
    </form>
  </section>

  <section id="dashboard" class="hidden">
    <div class="top"><div><div class="eyebrow">Meet Milan</div><h1>Availability & requests</h1></div><button class="ghost" id="logout">Sign out</button></div>
    <section class="card">
      <h2>Add an available time</h2>
      <form id="slotForm" class="row"><div><label for="startsAt">Date and time</label><input id="startsAt" type="datetime-local" required /></div><button type="submit">Add time</button></form>
      <p class="status" id="adminStatus" aria-live="polite"></p>
    </section>
    <section class="card"><div class="top" style="margin-bottom:8px"><h2>Upcoming times</h2><button class="ghost" id="refresh">Refresh</button></div><div id="slots"><p class="empty">Loading…</p></div></section>
  </section>
</main>
<script>
  var SB_URL='https://evernyxfvzhpkmbjlpoi.supabase.co';
  var SB_KEY='sb_publishable_eDp6rlAORmqM9BgnnjZRgg_WDiaD2jq';
  var token=sessionStorage.getItem('milan_admin_token')||'';
  var loginPanel=document.getElementById('loginPanel'),passwordPanel=document.getElementById('passwordPanel'),dashboard=document.getElementById('dashboard');
  var adminStatus=document.getElementById('adminStatus');
  function headers(json){var h={'apikey':SB_KEY,'Authorization':'Bearer '+(token||SB_KEY)};if(json)h['Content-Type']='application/json';return h}
  function showDashboard(on){loginPanel.classList.toggle('hidden',on);passwordPanel.classList.add('hidden');dashboard.classList.toggle('hidden',!on);if(on)loadSlots()}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function formatDate(v){return new Intl.DateTimeFormat('en-NL',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}
  async function api(path,options){var res=await fetch(SB_URL+path,Object.assign({headers:headers(true)},options||{}));if(!res.ok)throw new Error((await res.text())||'Request failed');return res.status===204?null:res.json()}
  document.getElementById('loginForm').addEventListener('submit',async function(e){e.preventDefault();var s=document.getElementById('loginStatus');s.className='status';s.textContent='Signing in…';try{
    var res=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
    var data=await res.json();if(!res.ok||!data.access_token)throw new Error('Sign-in failed.');token=data.access_token;sessionStorage.setItem('milan_admin_token',token);showDashboard(true);
  }catch(err){s.className='status error';s.textContent=err.message}});
  document.getElementById('passwordForm').addEventListener('submit',async function(e){e.preventDefault();var s=document.getElementById('passwordStatus'),p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;s.className='status';
    if(p!==c){s.className='status error';s.textContent='The passwords do not match.';return}s.textContent='Saving…';try{
      var res=await fetch(SB_URL+'/auth/v1/user',{method:'PUT',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:p})});
      if(!res.ok)throw new Error('The invitation has expired. Request a new invitation.');sessionStorage.setItem('milan_admin_token',token);history.replaceState(null,'',location.pathname);showDashboard(true);
    }catch(err){s.className='status error';s.textContent=err.message}
  });
  async function loadSlots(){var box=document.getElementById('slots');box.innerHTML='<p class="empty">Loading…</p>';try{
    var slots=await api('/rest/v1/booking_slots?select=*,booking_requests(*)&starts_at=gte.'+encodeURIComponent(new Date().toISOString())+'&order=starts_at.asc');
    if(!slots.length){box.innerHTML='<p class="empty">No upcoming times yet.</p>';return}
    box.innerHTML=slots.map(function(slot){var req=(slot.booking_requests||[]).find(function(r){return r.status==='pending'})||slot.booking_requests?.[0];return '<article class="slot"><div class="slot-head"><div class="slot-time">'+esc(formatDate(slot.starts_at))+'</div><span class="pill '+esc(slot.status)+'">'+esc(slot.status.replace('_',' '))+'</span></div>'+(req?'<div class="request"><p><strong>'+esc(req.name)+'</strong> · '+esc(req.contact)+'</p><p>'+esc(req.duration)+' · '+esc(req.location)+'</p><p>'+esc(req.message)+'</p>'+(req.status==='pending'?'<div class="actions"><button data-action="approved" data-request="'+req.id+'">Approve</button><button class="danger" data-action="rejected" data-request="'+req.id+'">Reject</button></div>':'<p>Status: '+esc(req.status)+'</p>')+'</div>':'')+'<div class="actions"><button class="ghost" data-slot="'+slot.id+'" data-status="'+(slot.status==='blocked'?'available':'blocked')+'">'+(slot.status==='blocked'?'Make available':'Block time')+'</button><button class="danger" data-delete="'+slot.id+'">Delete</button></div></article>'}).join('');
  }catch(err){box.innerHTML='<p class="empty error">Access denied or booking database is not configured.</p>';sessionStorage.removeItem('milan_admin_token');token='';setTimeout(function(){showDashboard(false)},1400)}}
  document.getElementById('slotForm').addEventListener('submit',async function(e){e.preventDefault();adminStatus.textContent='Adding…';try{await api('/rest/v1/booking_slots',{method:'POST',headers:Object.assign(headers(true),{'Prefer':'return=minimal'}),body:JSON.stringify({starts_at:new Date(startsAt.value).toISOString(),status:'available'})});startsAt.value='';adminStatus.textContent='Time added.';loadSlots()}catch(err){adminStatus.className='status error';adminStatus.textContent=err.message}});
  document.getElementById('slots').addEventListener('click',async function(e){var b=e.target.closest('button');if(!b)return;b.disabled=true;try{
    if(b.dataset.request)await api('/rest/v1/rpc/admin_decide_booking',{method:'POST',body:JSON.stringify({p_request_id:b.dataset.request,p_decision:b.dataset.action})});
    if(b.dataset.slot)await api('/rest/v1/booking_slots?id=eq.'+b.dataset.slot,{method:'PATCH',headers:Object.assign(headers(true),{'Prefer':'return=minimal'}),body:JSON.stringify({status:b.dataset.status,updated_at:new Date().toISOString()})});
    if(b.dataset.delete)await api('/rest/v1/booking_slots?id=eq.'+b.dataset.delete,{method:'DELETE',headers:Object.assign(headers(true),{'Prefer':'return=minimal'})});
    loadSlots();
  }catch(err){adminStatus.className='status error';adminStatus.textContent=err.message;b.disabled=false}});
  document.getElementById('refresh').onclick=loadSlots;document.getElementById('logout').onclick=function(){sessionStorage.removeItem('milan_admin_token');token='';showDashboard(false)};
  var hashParams=new URLSearchParams(location.hash.replace(/^#/,''));
  var inviteToken=hashParams.get('access_token');
  if(inviteToken){token=inviteToken;loginPanel.classList.add('hidden');passwordPanel.classList.remove('hidden');dashboard.classList.add('hidden')}
  else if(token)showDashboard(true);
</script>
</body>
</html>
